<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>BradyAI</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >

  <!-- Clerk UI -->
  <script
    defer
    crossorigin="anonymous"
    src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
    type="text/javascript">
  </script>

  <!-- Clerk -->
  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_c2hpbmluZy1pbnNlY3QtNTkzLmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js">
  </script>

</head>


<body>

<main class="app-shell">

  <header>

    <div>
      <p class="eyebrow">LOCAL AI ASSISTANT</p>
      <h1>BradyAI</h1>
    </div>

    <button
      id="clear-memory"
      class="quiet-button"
      type="button"
    >
      Clear memory
    </button>

  </header>


  <!-- =========================================
       MESSAGES
  ========================================= -->

  <section
    id="messages"
    class="messages"
    aria-live="polite"
  ></section>


  <!-- =========================================
       COMPOSER
  ========================================= -->

  <form
    id="chat-form"
    class="composer"
  >

    <label for="message">
      Message
    </label>

    <div class="composer-row">

      <textarea
        id="message"
        rows="2"
        placeholder="Ask BradyAI anything..."
        required
      ></textarea>

      <button
        id="send"
        type="submit"
      >
        Send
      </button>

    </div>

    <p class="hint">
      Try:
      <code>research how do quantum computers work</code>
      or
      <code>remember I am building a game</code>
    </p>

  </form>

</main>


<script>

let conversationId = null;


/* =========================================
   DOM
========================================= */

const form =
  document.getElementById("chat-form");

const input =
  document.getElementById("message");

const messages =
  document.getElementById("messages");

const sendButton =
  document.getElementById("send");

const clearMemoryButton =
  document.getElementById("clear-memory");


/* =========================================
   CLERK
========================================= */

async function waitForClerk() {

  for (let i = 0; i < 100; i++) {

    if (
      typeof Clerk !== "undefined" &&
      Clerk.load
    ) {

      try {

        await Clerk.load();

        return true;

      } catch (error) {

        console.error(
          "Clerk load error:",
          error
        );

        return false;

      }

    }

    await new Promise(
      resolve => setTimeout(resolve, 100)
    );

  }

  return false;
}


/* =========================================
   AUTHENTICATION
========================================= */

async function checkAuthentication() {

  const loaded =
    await waitForClerk();

  if (!loaded) {

    console.error(
      "Clerk failed to load."
    );

    return false;

  }

  if (!Clerk.isSignedIn) {

    window.location.href =
      "/sign-in";

    return false;

  }

  console.log(
    "Authenticated as:",
    Clerk.user.id
  );

  return true;
}


/* =========================================
   API REQUEST
========================================= */

async function apiRequest(
  url,
  options = {}
) {

  if (
    typeof Clerk === "undefined" ||
    !Clerk.session
  ) {

    throw new Error(
      "Clerk session is not available."
    );

  }


  const token =
    await Clerk.session.getToken();


  if (!token) {

    throw new Error(
      "Could not get authentication token."
    );

  }


  const headers = {
    "Content-Type":
      "application/json",

    "Authorization":
      `Bearer ${token}`
  };


  const response =
    await fetch(
      url,
      {
        ...options,

        headers: {
          ...headers,
          ...(options.headers || {})
        }
      }
    );


  let data = {};

  try {

    data =
      await response.json();

  } catch {

    data = {};

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );

  }


  return data;
}


/* =========================================
   DISPLAY MESSAGE
========================================= */

function addMessage(
  kind,
  name,
  text,
  sources = []
) {

  const card =
    document.createElement("article");

  card.className =
    `message ${kind}`;


  const title =
    document.createElement("strong");

  title.textContent =
    name;


  const body =
    document.createElement("p");

  body.textContent =
    text;


  card.append(
    title,
    body
  );


  if (sources.length) {

    const list =
      document.createElement("ul");

    list.className =
      "sources";


    sources.forEach(source => {

      if (!source.url) {
        return;
      }


      const item =
        document.createElement("li");


      const link =
        document.createElement("a");


      link.href =
        source.url;

      link.target =
        "_blank";

      link.rel =
        "noreferrer";

      link.textContent =
        source.title ||
        source.url;


      item.append(link);

      list.append(item);

    });


    if (list.children.length) {
      card.append(list);
    }

  }


  messages.append(card);

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================
   CLEAR DISPLAY
========================================= */

function clearMessages() {

  messages.innerHTML = "";

}


/* =========================================
   WELCOME MESSAGE
========================================= */

function showWelcome() {

  clearMessages();

  addMessage(
    "assistant",
    "BradyAI",
    "Hi! Ask me something, research a topic, or tell me a note to remember."
  );

}


/* =========================================
   CREATE CONVERSATION
========================================= */

async function createConversation(
  title = "New Chat"
) {

  const data =
    await apiRequest(
      "/api/conversations",
      {
        method: "POST",

        body: JSON.stringify({
          title: title
        })
      }
    );


  conversationId =
    data.id;


  console.log(
    "Created conversation:",
    conversationId
  );


  return conversationId;
}


/* =========================================
   LOAD CONVERSATION
========================================= */

async function loadConversation() {

  if (!conversationId) {

    await createConversation();

    showWelcome();

    return;

  }


  const data =
    await apiRequest(
      `/api/conversations/${conversationId}`
    );


  clearMessages();


  if (
    !data.messages ||
    data.messages.length === 0
  ) {

    showWelcome();

    return;

  }


  data.messages.forEach(
    message => {

      const kind =
        message.role === "user"
          ? "user"
          : "assistant";


      const name =
        message.role === "user"
          ? "You"
          : "BradyAI";


      addMessage(
        kind,
        name,
        message.content
      );

    }
  );

}


/* =========================================
   GET USER'S CONVERSATIONS
========================================= */

async function getConversations() {

  const data =
    await apiRequest(
      "/api/conversations"
    );


  return data.conversations || [];

}


/* =========================================
   LOAD OR CREATE CHAT
========================================= */

async function initializeConversation() {

  const conversations =
    await getConversations();


  /*
    If the user already has a conversation,
    load the most recently updated one.
  */

  if (conversations.length > 0) {

    conversationId =
      conversations[0].id;


    console.log(
      "Loading existing conversation:",
      conversationId
    );


    await loadConversation();

    return;

  }


  /*
    No conversations yet.
    Create the first one.
  */

  console.log(
    "No conversations found. Creating one..."
  );


  await createConversation();

  showWelcome();

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(message) {

  sendButton.disabled =
    true;

  sendButton.textContent =
    "Thinking...";


  try {

    /*
      Make sure a conversation exists.
    */

    if (!conversationId) {

      await createConversation();

    }


    /*
      Ask BradyAI.

      IMPORTANT:
      The backend handles the AI response
      and memory.
    */

    const response =
      await apiRequest(
        "/api/chat",
        {
          method: "POST",

          body: JSON.stringify({
            message: message
          })
        }
      );


    const reply =
      response.reply ||
      "Something went wrong.";


    /*
      Display AI response.
    */

    addMessage(
      "assistant",
      "BradyAI",
      reply,
      response.sources || []
    );


    /*
      Save user message to conversation.
    */

    await apiRequest(
      `/api/conversations/${conversationId}/messages`,
      {
        method: "POST",

        body: JSON.stringify({
          role: "user",
          content: message
        })
      }
    );


    /*
      Save BradyAI response to conversation.
    */

    await apiRequest(
      `/api/conversations/${conversationId}/messages`,
      {
        method: "POST",

        body: JSON.stringify({
          role: "assistant",
          content: reply
        })
      }
    );


  } catch (error) {

    console.error(
      "CHAT ERROR:",
      error
    );


    addMessage(
      "assistant",
      "BradyAI",
      error.message ||
      "Could not reach BradyAI."
    );


  } finally {

    sendButton.disabled =
      false;

    sendButton.textContent =
      "Send";

    input.focus();

  }

}


/* =========================================
   FORM SUBMIT
========================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const message =
      input.value.trim();


    if (!message) {
      return;
    }


    /*
      Display user message immediately.
    */

    addMessage(
      "user",
      "You",
      message
    );


    input.value = "";


    await sendMessage(
      message
    );

  }
);


/* =========================================
   CLEAR MEMORY
========================================= */

clearMemoryButton.addEventListener(
  "click",
  async () => {

    try {

      /*
        Clear the BradyAI memory through
        the normal chat API.
      */

      const response =
        await apiRequest(
          "/api/chat",
          {
            method: "POST",

            body: JSON.stringify({
              message: "clear memory"
            })
          }
        );


      addMessage(
        "assistant",
        "BradyAI",
        response.reply ||
        "Memory cleared."
      );


    } catch (error) {

      console.error(
        "CLEAR MEMORY ERROR:",
        error
      );


      addMessage(
        "assistant",
        "BradyAI",
        error.message ||
        "Could not clear memory."
      );

    }

  }
);


/* =========================================
   START CHAT
========================================= */

async function initializeChat() {

  const authenticated =
    await checkAuthentication();


  if (!authenticated) {
    return;
  }


  try {

    await initializeConversation();

  } catch (error) {

    console.error(
      "Conversation initialization error:",
      error
    );


    clearMessages();


    addMessage(
      "assistant",
      "BradyAI",
      "I couldn't load your conversations. Check the server logs."
    );

  }

}


initializeChat();

</script>

</body>

</html>
