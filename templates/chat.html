<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>BradyAI</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >

  <!-- Clerk UI -->
  <script
    defer
    crossorigin="anonymous"
    src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
    type="text/javascript">
  </script>

  <!-- Clerk -->
  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_c2hpbmluZy1pbnNlY3QtNTkzLmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js">
  </script>

</head>


<body>

<main class="app-shell">

  <header>

    <div>

      <p class="eyebrow">
        LOCAL AI ASSISTANT
      </p>

      <h1>
        BradyAI
      </h1>

    </div>

    <button
      id="clear-memory"
      class="quiet-button"
      type="button"
    >
      Clear memory
    </button>

  </header>


  <!-- =========================================
       MESSAGES
  ========================================= -->

  <section
    id="messages"
    class="messages"
    aria-live="polite"
  >

    <article class="message assistant">

      <strong>
        BradyAI
      </strong>

      <p>
        Hi! Ask me something, research a topic,
        or tell me a note to remember.
      </p>

    </article>

  </section>


  <!-- =========================================
       COMPOSER
  ========================================= -->

  <form
    id="chat-form"
    class="composer"
  >

    <label for="message">
      Message
    </label>

    <div class="composer-row">

      <textarea
        id="message"
        rows="2"
        placeholder="Ask BradyAI anything..."
        required
      ></textarea>

      <button
        id="send"
        type="submit"
      >
        Send
      </button>

    </div>

    <p class="hint">

      Try:

      <code>
        research how do quantum computers work
      </code>

      or

      <code>
        remember I am building a game
      </code>

    </p>

  </form>

</main>


<script>

let conversationId = null;


/* =========================================
   CLERK
========================================= */

async function waitForClerk() {

  for (let i = 0; i < 100; i++) {

    if (
      typeof Clerk !== "undefined" &&
      Clerk.load
    ) {

      await Clerk.load();

      return true;

    }

    await new Promise(
      resolve => setTimeout(resolve, 100)
    );

  }

  return false;

}


/* =========================================
   AUTHENTICATION
========================================= */

async function checkAuthentication() {

  const loaded = await waitForClerk();

  if (!loaded) {

    console.error(
      "Clerk failed to load."
    );

    return false;

  }

  if (!Clerk.isSignedIn) {

    window.location.href = "/sign-in";

    return false;

  }

  console.log(
    "Authenticated as:",
    Clerk.user.id
  );

  return true;

}


/* =========================================
   API REQUEST HELPER
========================================= */

async function apiRequest(
  url,
  options = {}
) {

  const token =
    await Clerk.session.getToken();


  const headers = {

    "Content-Type":
      "application/json",

    "Authorization":
      `Bearer ${token}`

  };


  const response = await fetch(
    url,
    {
      ...options,
      headers: {
        ...headers,
        ...(options.headers || {})
      }
    }
  );


  let data = {};

  try {

    data = await response.json();

  } catch {

    data = {};

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );

  }


  return data;

}


/* =========================================
   DISPLAY MESSAGE
========================================= */

function addMessage(
  kind,
  name,
  text,
  sources = []
) {

  const card =
    document.createElement("article");

  card.className =
    `message ${kind}`;


  const title =
    document.createElement("strong");

  title.textContent =
    name;


  const body =
    document.createElement("p");

  body.textContent =
    text;


  card.append(
    title,
    body
  );


  if (sources.length) {

    const list =
      document.createElement("ul");

    list.className =
      "sources";


    sources.forEach(source => {

      const item =
        document.createElement("li");


      const link =
        document.createElement("a");


      link.href =
        source.url;


      link.target =
        "_blank";


      link.rel =
        "noreferrer";


      link.textContent =
        source.title ||
        source.url;


      item.append(link);

      list.append(item);

    });


    card.append(list);

  }


  messages.append(card);

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================
   CLEAR DISPLAY
========================================= */

function clearMessages() {

  messages.innerHTML = "";

}


/* =========================================
   CREATE CONVERSATION
========================================= */

async function createConversation() {

  const data =
    await apiRequest(
      "/api/conversations",
      {
        method: "POST",

        body: JSON.stringify({
          title: "New Chat"
        })

      }
    );


  conversationId =
    data.id;


  console.log(
    "Created conversation:",
    conversationId
  );

}


/* =========================================
   LOAD CONVERSATION
========================================= */

async function loadConversation() {

  if (!conversationId) {

    await createConversation();

    return;

  }


  const data =
    await apiRequest(
      `/api/conversations/${conversationId}`
    );


  clearMessages();


  if (
    !data.messages ||
    data.messages.length === 0
  ) {

    addMessage(
      "assistant",
      "BradyAI",
      "Hi! Ask me something, research a topic, or tell me a note to remember."
    );

    return;

  }


  data.messages.forEach(message => {

    const kind =
      message.role === "user"
        ? "user"
        : "assistant";


    const name =
      message.role === "user"
        ? "You"
        : "BradyAI";


    addMessage(
      kind,
      name,
      message.content
    );

  });

}


/* =========================================
   SEND CHAT MESSAGE
========================================= */

async function sendMessage(message) {

  sendButton.disabled =
    true;

  sendButton.textContent =
    "Thinking...";


  try {

    if (!conversationId) {

      await createConversation();

    }


    /*
      Save the user's message.
    */

    await apiRequest(
      `/api/conversations/${conversationId}/messages`,
      {
        method: "POST",

        body: JSON.stringify({
          role: "user",
          content: message
        })

      }
    );


    /*
      Ask BradyAI.
    */

    const response =
      await apiRequest(
        "https://bradyai-web.onrender.com/api/chat",
        {
          method: "POST",

          body: JSON.stringify({
            message: message
          })

        }
      );


    const reply =
      response.reply ||
      response.error ||
      "Something went wrong.";


    /*
      Display AI response.
    */

    addMessage(
      "assistant",
      "BradyAI",
      reply,
      response.sources || []
    );


    /*
      Save AI response.
    */

    await apiRequest(
      `/api/conversations/${conversationId}/messages`,
      {
        method: "POST",

        body: JSON.stringify({
          role: "assistant",
          content: reply
        })

      }
    );


  } catch (error) {

    console.error(
      "CHAT ERROR:",
      error
    );


    addMessage(
      "assistant",
      "BradyAI",
      error.message ||
      "Could not reach BradyAI."
    );


  } finally {

    sendButton.disabled =
      false;

    sendButton.textContent =
      "Send";

    input.focus();

  }

}


/* =========================================
   FORM
========================================= */

const form =
  document.getElementById(
    "chat-form"
  );


const input =
  document.getElementById(
    "message"
  );


const messages =
  document.getElementById(
    "messages"
  );


const sendButton =
  document.getElementById(
    "send"
  );


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const message =
      input.value.trim();


    if (!message) {

      return;

    }


    addMessage(
      "user",
      "You",
      message
    );


    input.value = "";


    await sendMessage(
      message
    );

  }
);


/* =========================================
   CLEAR MEMORY
========================================= */

document
  .getElementById("clear-memory")
  .addEventListener(
    "click",
    async () => {

      addMessage(
        "user",
        "You",
        "clear memory"
      );


      await sendMessage(
        "clear memory"
      );

    }
  );


/* =========================================
   START
========================================= */

async function initializeChat() {

  const authenticated =
    await checkAuthentication();


  if (!authenticated) {

    return;

  }


  try {

    /*
      For now, create a new conversation
      when the page is opened.
    */

    await createConversation();

  } catch (error) {

    console.error(
      "Conversation initialization error:",
      error
    );

  }

}


initializeChat();

</script>

</body>

</html>
