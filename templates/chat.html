<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>BradyAI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >


    <!-- =========================================
         CLERK UI
    ========================================== -->

    <script
        defer
        crossorigin="anonymous"
        src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
        type="text/javascript">
    </script>


    <!-- =========================================
         CLERK JS
    ========================================== -->

    <script
        defer
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_c2hpbmluZy1pbnNlY3QtNTkzLmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript">
    </script>

</head>


<body>

    <main class="app-shell">

        <header>

            <div>

                <p class="eyebrow">
                    LOCAL AI ASSISTANT
                </p>

                <h1>
                    BradyAI
                </h1>

            </div>


            <button
                id="clear-memory"
                class="quiet-button"
                type="button"
            >
                Clear memory
            </button>

        </header>


        <section
            id="messages"
            class="messages"
            aria-live="polite"
        >

            <article class="message assistant">

                <strong>
                    BradyAI
                </strong>

                <p>
                    Hi! Ask me something, research a topic,
                    or tell me a note to remember.
                </p>

            </article>

        </section>


        <form
            id="chat-form"
            class="composer"
        >

            <label for="message">
                Message
            </label>


            <div class="composer-row">

                <textarea
                    id="message"
                    rows="2"
                    placeholder="Ask BradyAI anything..."
                    required
                ></textarea>


                <button
                    id="send"
                    type="submit"
                >
                    Send
                </button>

            </div>


            <p class="hint">

                Try:

                <code>
                    research how do quantum computers work
                </code>

                or

                <code>
                    remember I am building a game
                </code>

            </p>

        </form>

    </main>


    <script>

        const form =
            document.getElementById("chat-form");

        const input =
            document.getElementById("message");

        const messages =
            document.getElementById("messages");

        const sendButton =
            document.getElementById("send");


        // =========================================
        // WAIT FOR CLERK
        // =========================================

        function waitForClerk() {

            return new Promise((resolve, reject) => {

                let attempts = 0;

                const maxAttempts = 200;

                const check = setInterval(() => {

                    attempts++;

                    if (typeof Clerk !== "undefined") {

                        clearInterval(check);

                        resolve(Clerk);

                        return;

                    }

                    if (attempts >= maxAttempts) {

                        clearInterval(check);

                        reject(
                            new Error(
                                "Clerk failed to load."
                            )
                        );

                    }

                }, 50);

            });

        }


        // =========================================
        // CLERK INITIALIZATION
        // =========================================

        let clerkReady = null;


        async function initializeClerk() {

            if (!clerkReady) {

                clerkReady = (async () => {

                    const clerk =
                        await waitForClerk();

                    await clerk.load();

                    return clerk;

                })();

            }

            return clerkReady;

        }


        // =========================================
        // ADD MESSAGE
        // =========================================

        function addMessage(
            kind,
            name,
            text,
            sources = []
        ) {

            const card =
                document.createElement("article");

            card.className =
                `message ${kind}`;


            const title =
                document.createElement("strong");

            title.textContent =
                name;


            const body =
                document.createElement("p");

            body.textContent =
                text;


            card.append(
                title,
                body
            );


            if (sources.length) {

                const list =
                    document.createElement("ul");

                list.className =
                    "sources";


                sources.forEach(source => {

                    const item =
                        document.createElement("li");


                    const link =
                        document.createElement("a");

                    link.href =
                        source.url;

                    link.target =
                        "_blank";

                    link.rel =
                        "noreferrer";

                    link.textContent =
                        source.title ||
                        source.url;


                    item.append(link);

                    list.append(item);

                });


                card.append(list);

            }


            messages.append(card);

            messages.scrollTop =
                messages.scrollHeight;

        }


        // =========================================
        // SEND MESSAGE
        // =========================================

        async function sendMessage(message) {

            sendButton.disabled =
                true;

            sendButton.textContent =
                "Thinking...";


            try {

                const clerk =
                    await initializeClerk();


                // Make sure there is a session

                if (!clerk.session) {

                    addMessage(
                        "assistant",
                        "BradyAI",
                        "You must be signed in to use BradyAI."
                    );

                    return;

                }


                // Get Clerk token

                const token =
                    await clerk.session.getToken();


                if (!token) {

                    throw new Error(
                        "Clerk did not provide an authentication token."
                    );

                }


                console.log(
                    "Sending authenticated request..."
                );


                const response =
                    await fetch(
                        "https://bradyai-web.onrender.com/api/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            },

                            body: JSON.stringify({
                                message: message
                            })
                        }
                    );


                console.log(
                    "API status:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "API response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        `Server returned ${response.status}`
                    );

                }


                addMessage(
                    "assistant",
                    "BradyAI",
                    data.reply ||
                    "No response was returned.",
                    data.sources ||
                    []
                );


            } catch (error) {

                console.error(
                    "CHAT ERROR:",
                    error
                );


                addMessage(
                    "assistant",
                    "BradyAI",
                    `Error: ${error.message}`
                );


            } finally {

                sendButton.disabled =
                    false;

                sendButton.textContent =
                    "Send";

                input.focus();

            }

        }


        // =========================================
        // FORM SUBMIT
        // =========================================

        form.addEventListener(
            "submit",
            event => {

                event.preventDefault();


                const message =
                    input.value.trim();


                if (!message) {
                    return;
                }


                addMessage(
                    "user",
                    "You",
                    message
                );


                input.value = "";


                sendMessage(message);

            }
        );


        // =========================================
        // CLEAR MEMORY
        // =========================================

        document
            .getElementById("clear-memory")
            .addEventListener(
                "click",
                () => {

                    addMessage(
                        "user",
                        "You",
                        "clear memory"
                    );


                    sendMessage(
                        "clear memory"
                    );

                }
            );


        // =========================================
        // AUTHENTICATION
        // =========================================

        async function checkAuthentication() {

            try {

                const clerk =
                    await initializeClerk();


                if (!clerk.session) {

                    window.location.href =
                        "/sign-in";

                    return;

                }


                console.log(
                    "Authenticated as:",
                    clerk.user?.id
                );


            } catch (error) {

                console.error(
                    "Authentication error:",
                    error
                );

            }

        }


        // Start authentication

        checkAuthentication();

    </script>


</body>

</html>
