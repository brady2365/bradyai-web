<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — BradyAI</title>

    <!-- Clerk -->
    <script
      defer
      crossorigin="anonymous"
      src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
      type="text/javascript">
    </script>

    <script
      defer
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_c2hpbmluZy1pbnNlY3QtNTkzLmNsZXJrLmFjY291bnRzLmRldiQ"
      src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
      type="text/javascript">
    </script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }


        /* ================================
           BACKGROUND
        ================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }


        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
        }


        .glow.one {
            background: #5865f2;
            top: -250px;
            left: -150px;
        }


        .glow.two {
            background: #7c3aed;
            bottom: -300px;
            right: -150px;
        }


        /* ================================
           PAGE
        ================================= */

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }


        /* ================================
           CARD
        ================================= */

        .card {
            width: 100%;
            max-width: 430px;

            background: rgba(15, 15, 18, 0.92);

            border: 1px solid rgba(
                255,
                255,
                255,
                0.09
            );

            border-radius: 22px;

            padding: 38px 34px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(88, 101, 242, 0.06);

            backdrop-filter: blur(20px);
        }


        /* ================================
           BRAND
        ================================= */

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin-bottom: 30px;
        }


        .brand-logo {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #5865f2,
                #7c3aed
            );

            font-size: 22px;
            font-weight: 800;

            box-shadow:
                0 8px 25px rgba(
                    88,
                    101,
                    242,
                    0.3
                );
        }


        .brand-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }


        /* ================================
           HEADER
        ================================= */

        .header {
            text-align: center;
            margin-bottom: 28px;
        }


        .header h1 {
            font-size: 30px;
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 9px;
        }


        .header p {
            color: #8e8e98;
            font-size: 14px;
        }


        /* ================================
           CLERK
        ================================= */

        #clerk-sign-up {
            width: 100%;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 500px) {

            .page {
                padding: 15px;
            }

            .card {
                padding: 30px 22px;
                border-radius: 18px;
            }

            .header h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

    <div class="background">

        <div class="glow one"></div>

        <div class="glow two"></div>

    </div>


    <main class="page">

        <section class="card">

            <div class="brand">

                <div class="brand-logo">
                    B
                </div>

                <div class="brand-name">
                    BradyAI
                </div>

            </div>


            <div class="header">

                <h1>
                    Create your account
                </h1>

                <p>
                    Join BradyAI and start chatting
                </p>

            </div>


            <div id="clerk-sign-up"></div>

        </section>

    </main>


    <script>

        window.addEventListener("load", async () => {

            try {

                await Clerk.load();

                console.log(
                    "Clerk loaded successfully."
                );


                Clerk.mountSignUp(
                    document.getElementById(
                        "clerk-sign-up"
                    ),
                    {
                        routing: "hash",
                        signInUrl: "/sign-in"
                    }
                );

            } catch (error) {

                console.error(
                    "Clerk failed to load:",
                    error
                );

            }

        });

    </script>

</body>

</html>
