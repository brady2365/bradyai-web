<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — BradyAI</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='bradyai.png') }}">

    <!-- Clerk UI -->
    <script
        defer
        crossorigin="anonymous"
        src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
        type="text/javascript">
    </script>

    <!-- Clerk JS -->
    <script
        defer
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_c2hpbmluZy1pbnNlY3QtNTkzLmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://shining-insect-593.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript">
    </script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #050505;
            color: #ffffff;

            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =========================================
           BACKGROUND
        ========================================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .background::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 15%,
                    rgba(88, 101, 242, 0.15),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 85%,
                    rgba(124, 58, 237, 0.12),
                    transparent 35%
                );

            pointer-events: none;
        }

        .glow {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            filter: blur(140px);

            opacity: 0.14;
        }

        .glow.one {
            background: #5865f2;

            top: -280px;
            left: -200px;
        }

        .glow.two {
            background: #7c3aed;

            bottom: -300px;
            right: -200px;
        }

        /* =========================================
           GRID
        ========================================= */

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 80%
            );
        }

        /* =========================================
           PAGE
        ========================================= */

        .page {
            position: relative;
            z-index: 1;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        /* =========================================
           CARD
        ========================================= */

        .card {
            width: 100%;
            max-width: 460px;

            padding: 42px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20,20,24,0.96),
                    rgba(10,10,12,0.96)
                );

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 24px;

            box-shadow:
                0 30px 100px rgba(0,0,0,0.60),
                0 0 100px rgba(88,101,242,0.07);

            backdrop-filter: blur(30px);

            animation: cardIn 0.5s ease;
        }

        @keyframes cardIn {

            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* =========================================
           BRAND
        ========================================= */

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            margin-bottom: 32px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #5865f2,
                    #7c3aed
                );

            font-size: 22px;
            font-weight: 800;

            box-shadow:
                0 10px 30px rgba(88,101,242,0.30);
        }

        .brand-name {
            font-size: 23px;
            font-weight: 700;

            letter-spacing: -0.7px;
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            text-align: center;

            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 31px;
            font-weight: 700;

            letter-spacing: -1.2px;

            margin-bottom: 9px;
        }

        .header p {
            color: #92929d;

            font-size: 14px;
            line-height: 1.5;
        }

        /* =========================================
           CLERK
        ========================================= */

        #clerk-sign-in {
            width: 100%;
        }

        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            margin-top: 25px;

            text-align: center;

            color: #666671;

            font-size: 12px;
        }

        .footer a {
            color: #8b8bf4;

            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 520px) {

            .page {
                padding: 20px 14px;
            }

            .card {
                padding: 30px 20px;

                border-radius: 20px;
            }

            .header h1 {
                font-size: 27px;
            }

            .brand {
                margin-bottom: 27px;
            }

        }

    </style>

</head>

<body>

    <div class="background">

        <div class="glow one"></div>
        <div class="glow two"></div>

        <div class="grid"></div>

    </div>


    <main class="page">

        <section class="card">

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-logo">
                    B
                </div>

                <div class="brand-name">
                    BradyAI
                </div>

            </div>


            <!-- HEADER -->

            <div class="header">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to continue to your BradyAI account.
                </p>

            </div>


            <!-- CLERK -->

            <div id="clerk-sign-in"></div>


            <div class="footer">

                By continuing, you agree to the BradyAI
                <a href="#">Terms</a>
                and
                <a href="#">Privacy Policy</a>.

            </div>

        </section>

    </main>


<script>
    window.addEventListener("load", async () => {

        try {

            await Clerk.load({
                ui: {
                    ClerkUI: window.__internal_ClerkUICtor
                }
            });

            Clerk.mountSignIn(
                document.getElementById("clerk-sign-in"),
                {
                    routing: "hash",

                    signUpUrl: "/sign-up",

                    forceRedirectUrl: "/chat",
                    signUpForceRedirectUrl: "/chat",

                    appearance: {
                        variables: {
                            colorPrimary: "#6366f1",
                            colorBackground: "#111116",
                            colorText: "#ffffff",
                            colorTextSecondary: "#9ca3af",
                            colorInputBackground: "#0b0b0f",
                            colorInputText: "#ffffff",
                            borderRadius: "12px"
                        }
                    }
                }
            );

        } catch (error) {

            console.error("CLERK ERROR:", error);

        }

    });
</script>

</body>

</html>
