<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BradyAI</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <main class="app-shell">
    <header>
      <div>
        <p class="eyebrow">LOCAL AI ASSISTANT</p>
        <h1>BradyAI</h1>
      </div>
      <button id="clear-memory" class="quiet-button">Clear memory</button>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <article class="message assistant">
        <strong>BradyAI</strong>
        <p>Hi! Ask me something, research a topic, or tell me a note to remember.</p>
      </article>
    </section>

    <form id="chat-form" class="composer">
      <label for="message">Message</label>
      <div class="composer-row">
        <textarea id="message" rows="2" placeholder="Ask BradyAI anything..." required></textarea>
        <button id="send" type="submit">Send</button>
      </div>
      <p class="hint">Try: <code>research how do quantum computers work</code> or <code>remember I am building a game</code></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const messages = document.getElementById('messages');
    const sendButton = document.getElementById('send');

    function addMessage(kind, name, text, sources = []) {
      const card = document.createElement('article');
      card.className = `message ${kind}`;
      const title = document.createElement('strong');
      title.textContent = name;
      const body = document.createElement('p');
      body.textContent = text;
      card.append(title, body);

      if (sources.length) {
        const list = document.createElement('ul');
        list.className = 'sources';
        sources.forEach(source => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = source.url;
          link.target = '_blank';
          link.rel = 'noreferrer';
          link.textContent = source.title || source.url;
          item.append(link);
          list.append(item);
        });
        card.append(list);
      }

      messages.append(card);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage(message) {
      sendButton.disabled = true;
      sendButton.textContent = 'Thinking...';
      try {
        const response = await fetch('https://YOUR-API-SERVICE.onrender.com/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message})
        });
        const data = await response.json();
        addMessage('assistant', 'BradyAI', data.reply || data.error || 'Something went wrong.', data.sources || []);
        } catch (error) {
            console.error('BradyAI error:', error);
            addMessage('assistant', 'BradyAI', 'Error connecting to BradyAI: ' + error.message);
        } finally {
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
        input.focus();
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage('user', 'You', message);
      input.value = '';
      sendMessage(message);
    });

    document.getElementById('clear-memory').addEventListener('click', () => {
      addMessage('user', 'You', 'clear memory');
      sendMessage('clear memory');
    });
  </script>
</body>
</html>
